[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meme-bili"
version = "0.2.0"
description = "B站梗百科 CLI —— LLM 操作员驱动的梗采集、归纳、检索与生命周期管理"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "jieba>=0.42",
    "pydantic>=2.7",
    "numpy>=1.26",
    "fastembed>=0.4",
    "pillow>=10.0",
]

[project.scripts]
meme = "meme.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/meme"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
