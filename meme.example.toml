# meme 配置示例。全部字段都有内置默认值——按需拷贝修改。
# 查找顺序：$MEME_CONFIG → ./meme.toml → ~/.meme/meme.toml
# 环境变量：MEME_DB（库路径）；DEEPSEEK_API_KEY / DEEPSEEK_BASE_URL（模型接入，DSH 约定）

[db]
# path = "D:/data/memes.db"      # 默认 ~/.meme/memes.db

[fetch]
# 采样框（§11）：发现靠自动推送（推荐流）+ 兜底（热门/分区），检索只作确认（surf --probe）
popular_pages = 1                 # 热门榜单页数（每页 20 视频）
weekly = true                     # 每周必看
feed = true                       # 首页推荐流（自动推送）：发现的主动入口，登录态个性化
feed_pages = 2                    # 推荐流页数（每页约 12-20 视频）
regions = [119]                   # 分区 id：119=鬼畜（次生梗高发区），可加 1=动画 4=游戏 等
ups = []                          # 目标 up 主 mid 列表，如 [946974]（匿名可能被风控，失败自动跳过）
videos_per_round = 15             # 每轮 surf 采样视频上限
comments_per_video = 200          # 每视频评论上限（含楼中楼）
reply_pages_per_video = 3
region_pages = 1                  # 每个分区拉取页数（每页 20 视频）
max_comment_age_days = 30         # 评论年龄闸门：远古评论不入湖（0=不过滤）
max_video_age_days = 10           # 视频年龄闸门：只采 N 天内发布的视频（0=不过滤）
sessdata_env = ""                 # 登录态环境变量名（如 "BILI_SESSDATA"）：解锁搜索探测/完整评论区；空=匿名
probe_keywords = 0                # 每轮用登录态搜索探测的热词条数（配合 surf --probe 定向追梗）
subreply_roots = 5                # 每视频补全楼中楼的根评论数（接龙/交互梗样本）
subreply_pages_per_root = 1       # 每根评论的楼中楼页数
comment_images_per_round = 20     # 每轮下载并 pHash 的评论图片上限（图梗发现，0=关闭）
delay_min = 0.8                   # 请求间隔（秒）——礼貌拉取
delay_max = 1.5

[detect]
# 停用词三级结构：内置保守黑名单 ∪ generic_extra（此处追加） ∪ kv generic_auto（surf --ban 沉淀）。
# 内置表只收语法词/语气词/泛用单字——单字梗（典绷麻蚌孝急寄润燃乐拉艹6）绝不在列；
# 误杀可用 surf --allow 词 恢复（kv generic_allow 豁免表）。
generic_extra = []                # 追加停用词，如 ["希望", "内存"]

[induction]
model = "deepseek-flash"          # 旗舰归纳（formula/format/interaction）；DSH 模型 ID 直通
small_model = "deepseek-flash"    # triage 轻量任务（word 类 gist / 卡片）
reasoning_effort = "low"          # off | low | high | max
max_tokens = 8192
daily_call_budget = 40            # 归纳日预算（调用次数）；超限排队等下一轮 surf
backtest_holdout = 0.3            # 留出集比例
backtest_min_hit = 0.7            # 留出集命中率闸门
backtest_max_fp = 0.02            # 负例误报率闸门
backtest_negatives = 1000         # 负例采样数（来自原始湖）

[retrieval]
default_level = "card"            # brief | card | full
round_size = 10                   # surf 每页呈现预算（O3 待校准）
search_top = 8
vector_threshold = 0.60           # 向量兜底命中下限（余弦）
embed_model = "BAAI/bge-small-zh-v1.5"

[lifecycle]
trigger_rounds = 2                # 候选触发：跨轮次数（O2 待校准）
trigger_videos = 8                # 跨不相干视频数下限（O2）
trigger_z = 4.0                   # 爆发 z 值下限（O2）
trigger_videos_alt = 15           # 无爆发但视频数达到此值也触发
promote_rounds = 2                # observing→active 连续野外轮数
fade_window_days = 90
fade_drop = 0.5                   # 窗口内频率下降比例阈值
tombstone_ratio = 0.1             # 衰减至峰值比例以下 → tombstone
candidate_expire_rounds = 6       # 候选过期（O4）
backlog_alert = 10                # 欠账提醒阈值（O3）
